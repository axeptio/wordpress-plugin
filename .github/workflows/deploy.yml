name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'
  # Manual trigger for testing. Note: dry-run on a branch won't perfectly simulate
  # a tag-based deploy since 10up action derives version from the git tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no SVN commit)'
        required: false
        default: true
        type: boolean
      version:
        description: 'Version to deploy (required for manual runs, e.g. 2.6.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Run JS lint
        run: yarn eslint

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'

      - name: Install Composer dependencies (with dev tools)
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer phpcs

      - name: Run PHP unit tests
        run: composer test

  deploy:
    name: Deploy Plugin
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Build assets
        run: yarn build:production

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader

      # NOTE: .distignore controls what's excluded from WordPress.org via this CI workflow.
      # exclusions.txt serves the same purpose for the manual `task release` Taskfile command.
      # Keep both files in sync until one is retired.
      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}
        with:
          generate-zip: true
          dry-run: ${{ inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: axeptio-sdk-integration
          VERSION: ${{ inputs.version || '' }}
          ASSETS_DIR: release-assets

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && github.event_name == 'push' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
